<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>家事モンスター</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }

    @supports (height: 100dvh) {
      body {
        height: 100dvh;
      }
    }

    @supports not (height: 100dvh) {
      body {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <img src="image.png" alt="家事モンスター">
</body>
</html>
