<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>家事モンスター</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .screen {
      position: fixed;
      left: 0;
      top: 0;

      width: var(--viewport-width, 100vw);
      height: var(--viewport-height, 100vh);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      background: #000;
    }

    /* 余った部分は同じ画像をぼかして表示 */
    .screen::before {
      content: "";
      position: absolute;
      inset: -30px;

      background:
        url("image.png")
        center center / cover
        no-repeat;

      filter: blur(26px) brightness(0.72);
      transform: scale(1.08);
    }

    /* メイン画像 */
    .screen img {
      position: relative;
      z-index: 1;

      display: block;

      width: auto;
      height: auto;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center center;

      transform: scale(var(--image-scale, 1));
      transform-origin: center center;
    }
  </style>
</head>

<body>

  <div class="screen">
    <img src="image.png" alt="家事モンスター">
  </div>

  <script>
    function adjustDisplay() {

      /*
        元画像：1080 × 1920
        縦横比 = 0.5625
      */
      const imageAspect = 1080 / 1920;

      const viewport = window.visualViewport;

      const width = viewport
        ? viewport.width
        : window.innerWidth;

      const height = viewport
        ? viewport.height
        : window.innerHeight;

      /*
        実際に表示できる画面サイズをCSSへ渡す
      */
      document.documentElement.style.setProperty(
        "--viewport-width",
        width + "px"
      );

      document.documentElement.style.setProperty(
        "--viewport-height",
        height + "px"
      );

      /*
        現在の画面の縦横比
      */
      const screenAspect = width / height;

      /*
        元画像との縦横比の違いを計算
      */
      const difference =
        Math.abs(screenAspect - imageAspect) / imageAspect;

      /*
        元画像と画面比率が近い
        → 102％

        差が大きい
        → 100％

        その中間
        → 自動的に100〜102％
      */

      let scale;

      if (difference <= 0.05) {

        scale = 1.02;

      } else if (difference >= 0.30) {

        scale = 1.00;

      } else {

        const ratio =
          (difference - 0.05) / (0.30 - 0.05);

        scale =
          1.02 - (0.02 * ratio);
      }

      document.documentElement.style.setProperty(
        "--image-scale",
        scale
      );
    }

    /*
      最初に実行
    */
    adjustDisplay();

    /*
      画面サイズが変わった時にも再計算
    */
    window.addEventListener(
      "resize",
      adjustDisplay
    );

    /*
      Safari・Chrome・アプリ内ブラウザなどの
      実際の表示領域が変化した場合にも対応
    */
    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        "resize",
        adjustDisplay
      );

      window.visualViewport.addEventListener(
        "scroll",
        adjustDisplay
      );
    }
  </script>

</body>
</html>
