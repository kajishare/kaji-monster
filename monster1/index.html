<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>家事モンスター</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
    }

    /* 余った部分は同じ画像をぼかして表示 */
    .screen::before {
      content: "";
      position: absolute;
      inset: -20px;
      background: url("image.png") center center / cover no-repeat;
      filter: blur(24px) brightness(0.72);
      transform: scale(1.08);
    }

    /* メイン画像：101％ */
    .screen img {
      position: relative;
      z-index: 1;
      display: block;

      width: auto;
      height: auto;

     max-width: 102vw;
　　　max-height: 102vh;
　　　max-height: 102svh;

      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="screen">
    <img src="image.png" alt="家事モンスター">
  </div>
</body>
</html>
