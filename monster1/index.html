<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>家事モンスター</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 100vw;

      /* 古い端末向け */
      height: 100vh;

      /* スマホ・タブレット向け */
      height: 100svh;
    }

    img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100vw;

      /* 古い端末向け */
      max-height: 100vh;

      /* スマホ・タブレット向け */
      max-height: 100svh;

      object-fit: contain;
    }
  </style>
</head>

<body>
  <img src="image.png" alt="家事モンスター">
</body>
</html>
